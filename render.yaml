# Déploiement automatique sur Render (« Blueprint ») : une base PostgreSQL + le site (API et pages).
# Mode d'emploi détaillé : docs/deploiement.md
databases:
  - name: craftflow-db
    databaseName: craftflow
    user: craftflow
    plan: free

services:
  - type: web
    name: craftflow
    runtime: node
    plan: free
    buildCommand: npm ci
    # npm start crée le schéma si la base est vide (jamais d'effacement d'une base existante)
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: craftflow-db
          property: connectionString
      # Secret de signature des sessions : généré par Render, jamais écrit dans Git
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      # Données de démonstration (comptes client, artisans, administrateur) créées au premier démarrage
      - key: SEED_DEMO
        value: "true"
      # Mot de passe de tous les comptes de démo : demandé à la création, jamais écrit dans Git
      - key: DEMO_PASSWORD
        sync: false
