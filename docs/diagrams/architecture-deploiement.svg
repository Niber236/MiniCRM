<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1664 800" width="1664" height="800" font-family="Arial, Helvetica, sans-serif"><rect width="1664" height="800" fill="#ffffff"/><rect x="30" y="200" width="300" height="290" rx="10" fill="#eef2f5" stroke="#44566a" stroke-width="2"/><text x="54" y="238" font-size="21" font-weight="700" fill="#0b5d6b" text-anchor="start">Poste de développement</text><text x="54" y="280" font-size="17" fill="#1f2d3a" text-anchor="start">WSL Ubuntu et VS Code</text><text x="54" y="316" font-size="17" fill="#1f2d3a" text-anchor="start">Node.js 20 et Git</text><text x="54" y="352" font-size="17" fill="#1f2d3a" text-anchor="start">PostgreSQL local</text><text x="54" y="388" font-size="17" fill="#1f2d3a" text-anchor="start">npm run dev, npm test</text><text x="54" y="424" font-size="17" fill="#1f2d3a" text-anchor="start">Postman : tests de l'API</text><rect x="430" y="110" width="300" height="200" rx="10" fill="#fff" stroke="#1f2d3a" stroke-width="2"/><text x="454" y="148" font-size="23" font-weight="700" fill="#0b5d6b" text-anchor="start">GitHub</text><text x="454" y="184" font-size="17" fill="#1f2d3a" text-anchor="start">Dépôt Niber236/MiniCRM</text><text x="454" y="214" font-size="17" fill="#1f2d3a" text-anchor="start">branches main, develop</text><text x="454" y="244" font-size="17" fill="#1f2d3a" text-anchor="start">et feature/*</text><text x="454" y="274" font-size="17" fill="#1f2d3a" text-anchor="start">versions v1.0.0 à v1.2.0</text><rect x="430" y="420" width="300" height="260" rx="10" fill="#e6f1f2" stroke="#0b5d6b" stroke-width="2.2"/><text x="454" y="458" font-size="21" font-weight="700" fill="#0b5d6b" text-anchor="start">GitHub Actions (CI)</text><text x="454" y="494" font-size="17" fill="#1f2d3a" text-anchor="start">À chaque push :</text><text x="454" y="530" font-size="17" fill="#1f2d3a" text-anchor="start">tests Node 20 + PostgreSQL 14</text><text x="454" y="566" font-size="17" fill="#1f2d3a" text-anchor="start">tests Node 22 + PostgreSQL 16</text><text x="454" y="602" font-size="17" fill="#1f2d3a" text-anchor="start">audit des dépendances (npm)</text><text x="454" y="638" font-size="17" fill="#1f2d3a" text-anchor="start">65 tests, tous verts</text><rect x="830" y="70" width="560" height="610" rx="12" fill="#e6f1f2" stroke="#0b5d6b" stroke-width="2.4"/><text x="854" y="108" font-size="23" font-weight="700" fill="#0b5d6b" text-anchor="start">Render (hébergeur)</text><rect x="860" y="130" width="500" height="250" rx="10" fill="#fff" stroke="#0b5d6b" stroke-width="1.8"/><text x="880" y="166" font-size="20" font-weight="700" fill="#1f2d3a" text-anchor="start">Service web craftflow</text><text x="880" y="200" font-size="16.5" fill="#1f2d3a" text-anchor="start">Node.js 22 : npm ci puis npm start</text><text x="880" y="227" font-size="16.5" fill="#1f2d3a" text-anchor="start">au démarrage : ensure-schema.js</text><text x="880" y="254" font-size="16.5" fill="#1f2d3a" text-anchor="start">(crée la base seulement si elle est vide)</text><text x="880" y="281" font-size="16.5" fill="#1f2d3a" text-anchor="start">sert l'API et les pages du site, en HTTPS</text><text x="880" y="308" font-size="16.5" fill="#1f2d3a" text-anchor="start">variables : DATABASE_URL, JWT_SECRET,</text><text x="880" y="335" font-size="16.5" fill="#1f2d3a" text-anchor="start">DEMO_PASSWORD (jamais dans Git)</text><rect x="860" y="440" width="500" height="200" rx="10" fill="#fbeadf" stroke="#b8500f" stroke-width="2"/><text x="880" y="476" font-size="20" font-weight="700" fill="#b8500f" text-anchor="start">Base PostgreSQL gérée</text><text x="880" y="512" font-size="16.5" fill="#1f2d3a" text-anchor="start">réseau privé : non accessible de l'extérieur</text><text x="880" y="542" font-size="16.5" fill="#1f2d3a" text-anchor="start">7 tables, 2 types ENUM, contraintes</text><text x="880" y="572" font-size="16.5" fill="#1f2d3a" text-anchor="start">données de démonstration créées</text><text x="880" y="602" font-size="16.5" fill="#1f2d3a" text-anchor="start">au premier démarrage (SEED_DEMO)</text><rect x="1450" y="135" width="190" height="140" rx="10" fill="#eef2f5" stroke="#44566a" stroke-width="2"/><text x="1470" y="170" font-size="20" font-weight="700" fill="#0b5d6b" text-anchor="start">Utilisateurs</text><text x="1470" y="198" font-size="16" fill="#1f2d3a" text-anchor="start">client, artisan,</text><text x="1470" y="224" font-size="16" fill="#1f2d3a" text-anchor="start">administrateur</text><text x="1470" y="250" font-size="16" fill="#1f2d3a" text-anchor="start">dans un navigateur</text><rect x="1450" y="300" width="190" height="105" rx="10" fill="#eef2f5" stroke="#44566a" stroke-width="2"/><text x="1470" y="336" font-size="20" font-weight="700" fill="#0b5d6b" text-anchor="start">Postman</text><text x="1470" y="363" font-size="16" fill="#1f2d3a" text-anchor="start">48 requêtes,</text><text x="1470" y="389" font-size="16" fill="#1f2d3a" text-anchor="start">87 vérifications</text><line x1="332" y1="225" x2="428" y2="225" stroke="#1f2d3a" stroke-width="2.4"/><polygon points="428.0,225.0 416.1,230.3 416.1,219.7" fill="#1f2d3a"/><text x="380" y="205" font-size="16" fill="#1f2d3a" text-anchor="middle">git push</text><line x1="580" y1="312" x2="580" y2="418" stroke="#1f2d3a" stroke-width="2.4"/><polygon points="580.0,418.0 574.7,406.1 585.3,406.1" fill="#1f2d3a"/><text x="596" y="372" font-size="16" fill="#1f2d3a" text-anchor="start">déclenche</text><line x1="732" y1="225" x2="858" y2="225" stroke="#0b5d6b" stroke-width="2.4"/><polygon points="858.0,225.0 846.1,230.3 846.1,219.7" fill="#0b5d6b"/><text x="780" y="190" font-size="14" fill="#1f2d3a" text-anchor="middle">déploiement</text><text x="780" y="208" font-size="14" fill="#1f2d3a" text-anchor="middle">automatique</text><line x1="1110" y1="382" x2="1110" y2="438" stroke="#b8500f" stroke-width="2.4"/><polygon points="1110.0,438.0 1104.7,426.1 1115.3,426.1" fill="#b8500f"/><polygon points="1110.0,382.0 1115.3,393.9 1104.7,393.9" fill="#b8500f"/><text x="1126" y="416" font-size="15" fill="#1f2d3a" text-anchor="start">SQL</text><line x1="1448" y1="205" x2="1362" y2="205" stroke="#1f2d3a" stroke-width="2.4"/><polygon points="1362.0,205.0 1373.9,199.7 1373.9,210.3" fill="#1f2d3a"/><polygon points="1448.0,205.0 1436.1,210.3 1436.1,199.7" fill="#1f2d3a"/><text x="1405" y="188" font-size="15" fill="#1f2d3a" text-anchor="middle">HTTPS</text><line x1="1448" y1="350" x2="1362" y2="350" stroke="#1f2d3a" stroke-width="2.4"/><polygon points="1362.0,350.0 1373.9,344.7 1373.9,355.3" fill="#1f2d3a"/><polygon points="1448.0,350.0 1436.1,355.3 1436.1,344.7" fill="#1f2d3a"/><text x="1405" y="333" font-size="15" fill="#1f2d3a" text-anchor="middle">HTTPS</text><text x="30" y="775" font-size="17" font-style="italic" fill="#5b6877" text-anchor="start">Configuration prête dans render.yaml (Blueprint). La CI de GitHub vérifie le code avant chaque mise en ligne de la branche main.</text></svg>