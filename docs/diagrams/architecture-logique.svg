<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1664 830" width="1664" height="830" font-family="Arial, Helvetica, sans-serif"><rect width="1664" height="830" fill="#ffffff"/><rect x="30" y="110" width="280" height="560" rx="10" fill="#eef2f5" stroke="#44566a" stroke-width="2"/><text x="54" y="146" font-size="23" font-weight="700" fill="#0b5d6b" text-anchor="start">Navigateur</text><text x="54" y="170" font-size="16" fill="#5b6877" text-anchor="start">ordinateur ou téléphone</text><rect x="46" y="195" width="248" height="62" rx="8" fill="#fff" stroke="#44566a" stroke-width="1.5"/><text x="60" y="221" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">10 pages HTML</text><text x="60" y="244" font-size="16" fill="#5b6877" text-anchor="start">public et 3 espaces</text><rect x="46" y="270" width="248" height="62" rx="8" fill="#fff" stroke="#44566a" stroke-width="1.5"/><text x="60" y="296" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">CSS commun</text><text x="60" y="319" font-size="16" fill="#5b6877" text-anchor="start">thèmes clair et sombre</text><rect x="46" y="345" width="248" height="195" rx="8" fill="#fff" stroke="#44566a" stroke-width="1.5"/><text x="60" y="371" font-size="17" font-weight="700" fill="#1f2d3a" text-anchor="start">JavaScript natif (ES6)</text><text x="60" y="400" font-size="16" fill="#5b6877" text-anchor="start">api.js : appels Fetch</text><text x="60" y="428" font-size="16" fill="#5b6877" text-anchor="start">session.js : qui est connecté</text><text x="60" y="456" font-size="16" fill="#5b6877" text-anchor="start">ui.js, layout.js</text><text x="60" y="484" font-size="16" fill="#5b6877" text-anchor="start">components.js</text><text x="60" y="512" font-size="16" fill="#5b6877" text-anchor="start">pages/ : un fichier par page</text><rect x="46" y="556" width="248" height="98" rx="8" fill="#e6f1f2" stroke="#0b5d6b" stroke-width="1.5"/><text x="60" y="585" font-size="17" font-weight="700" fill="#0b5d6b" text-anchor="start">Aucun framework</text><text x="60" y="609" font-size="16" fill="#1f2d3a" text-anchor="start">front-end : tout le code</text><text x="60" y="631" font-size="16" fill="#1f2d3a" text-anchor="start">est écrit à la main</text><line x1="312" y1="158" x2="472" y2="158" stroke="#1f2d3a" stroke-width="2.4"/><polygon points="472.0,158.0 460.1,163.3 460.1,152.7" fill="#1f2d3a"/><polygon points="312.0,158.0 323.9,152.7 323.9,163.3" fill="#1f2d3a"/><text x="392" y="140" font-size="16" fill="#1f2d3a" text-anchor="middle">HTTPS, JSON</text><text x="392" y="190" font-size="15" fill="#5b6877" text-anchor="middle">cookie JWT</text><rect x="450" y="30" width="810" height="770" rx="12" fill="#e6f1f2" stroke="#0b5d6b" stroke-width="2.4"/><text x="474" y="68" font-size="23" font-weight="700" fill="#0b5d6b" text-anchor="start">Serveur Node.js 20+ et Express 4</text><text x="474" y="92" font-size="16" fill="#5b6877" text-anchor="start">dossier src/ : une seule application sert l'API et les pages du site</text><rect x="474" y="110" width="762" height="96" rx="10" fill="#fff" stroke="#0b5d6b" stroke-width="1.6"/><circle cx="506" cy="158.0" r="19" fill="#0b5d6b"/><text x="506" y="165.0" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="540" y="150" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="start">Middlewares</text><text x="540" y="178" font-size="14.5" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#5b6877" text-anchor="start">src/app.js</text><text x="770" y="150" font-size="17" fill="#1f2d3a" text-anchor="start">helmet (CSP, HSTS), JSON limité à 20 Ko, cookies,</text><text x="770" y="176" font-size="17" fill="#1f2d3a" text-anchor="start">contrôle d'origine (CSRF), limiteur de connexions</text><line x1="506" y1="206" x2="506" y2="226" stroke="#0b5d6b" stroke-width="2.2"/><polygon points="506.0,226.0 500.7,214.1 511.3,214.1" fill="#0b5d6b"/><rect x="474" y="226" width="762" height="96" rx="10" fill="#fff" stroke="#0b5d6b" stroke-width="1.6"/><circle cx="506" cy="274.0" r="19" fill="#0b5d6b"/><text x="506" y="281.0" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="540" y="266" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="start">Routes</text><text x="540" y="294" font-size="14.5" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#5b6877" text-anchor="start">src/routes/index.js</text><text x="770" y="266" font-size="17" fill="#1f2d3a" text-anchor="start">25 routes sous /api. authenticate (JWT du cookie)</text><text x="770" y="292" font-size="17" fill="#1f2d3a" text-anchor="start">puis requireRole : client, artisan ou admin</text><line x1="506" y1="322" x2="506" y2="342" stroke="#0b5d6b" stroke-width="2.2"/><polygon points="506.0,342.0 500.7,330.1 511.3,330.1" fill="#0b5d6b"/><rect x="474" y="342" width="762" height="96" rx="10" fill="#fff" stroke="#0b5d6b" stroke-width="1.6"/><circle cx="506" cy="390.0" r="19" fill="#0b5d6b"/><text x="506" y="397.0" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="540" y="382" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="start">Contrôleurs</text><text x="540" y="410" font-size="14.5" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#5b6877" text-anchor="start">src/controllers/</text><text x="770" y="382" font-size="17" fill="#1f2d3a" text-anchor="start">validation des entrées, règles métier,</text><text x="770" y="408" font-size="17" fill="#1f2d3a" text-anchor="start">statusMachine : machine à états des rendez-vous</text><line x1="506" y1="438" x2="506" y2="458" stroke="#0b5d6b" stroke-width="2.2"/><polygon points="506.0,458.0 500.7,446.1 511.3,446.1" fill="#0b5d6b"/><rect x="474" y="458" width="762" height="96" rx="10" fill="#fff" stroke="#0b5d6b" stroke-width="1.6"/><circle cx="506" cy="506.0" r="19" fill="#0b5d6b"/><text x="506" y="513.0" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="540" y="498" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="start">Modèles</text><text x="540" y="526" font-size="14.5" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#5b6877" text-anchor="start">src/models/</text><text x="770" y="498" font-size="17" fill="#1f2d3a" text-anchor="start">requêtes SQL préparées ($1, $2...) :</text><text x="770" y="524" font-size="17" fill="#1f2d3a" text-anchor="start">aucune valeur n'est collée dans le texte SQL</text><line x1="506" y1="554" x2="506" y2="574" stroke="#0b5d6b" stroke-width="2.2"/><polygon points="506.0,574.0 500.7,562.1 511.3,562.1" fill="#0b5d6b"/><rect x="474" y="574" width="762" height="96" rx="10" fill="#fff" stroke="#0b5d6b" stroke-width="1.6"/><circle cx="506" cy="622.0" r="19" fill="#0b5d6b"/><text x="506" y="629.0" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="540" y="614" font-size="22" font-weight="700" fill="#1f2d3a" text-anchor="start">Accès à la base</text><text x="540" y="642" font-size="14.5" font-family="Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" fill="#5b6877" text-anchor="start">src/db/pool.js</text><text x="770" y="614" font-size="17" fill="#1f2d3a" text-anchor="start">pool de connexions pg, query(),</text><text x="770" y="640" font-size="17" fill="#1f2d3a" text-anchor="start">withTransaction() : BEGIN, COMMIT ou ROLLBACK</text><rect x="474" y="690" width="238" height="90" rx="8" fill="#fff" stroke="#44566a" stroke-width="1.4"/><text x="486" y="714" font-size="16.5" font-weight="700" fill="#0b5d6b" text-anchor="start">Gestion des erreurs</text><text x="486" y="738" font-size="14.5" fill="#5b6877" text-anchor="start">errorHandler : HttpError et</text><text x="486" y="758" font-size="14.5" fill="#5b6877" text-anchor="start">erreurs PostgreSQL → 400, 409</text><rect x="726" y="690" width="238" height="90" rx="8" fill="#fff" stroke="#44566a" stroke-width="1.4"/><text x="738" y="714" font-size="16.5" font-weight="700" fill="#0b5d6b" text-anchor="start">Configuration</text><text x="738" y="738" font-size="14.5" fill="#5b6877" text-anchor="start">config.js : variables</text><text x="738" y="758" font-size="14.5" fill="#5b6877" text-anchor="start">d'environnement et secret JWT</text><rect x="978" y="690" width="238" height="90" rx="8" fill="#fff" stroke="#44566a" stroke-width="1.4"/><text x="990" y="714" font-size="16.5" font-weight="700" fill="#0b5d6b" text-anchor="start">Pages du site</text><text x="990" y="738" font-size="14.5" fill="#5b6877" text-anchor="start">public/ servi par le même</text><text x="990" y="758" font-size="14.5" fill="#5b6877" text-anchor="start">serveur : une seule origine</text><rect x="1400" y="400" width="240" height="340" rx="12" fill="#fbeadf" stroke="#b8500f" stroke-width="2.4"/><text x="1418" y="438" font-size="23" font-weight="700" fill="#b8500f" text-anchor="start">PostgreSQL</text><text x="1418" y="462" font-size="15" fill="#5b6877" text-anchor="start">versions 14 et 16 testées</text><text x="1418" y="496" font-size="15.5" fill="#1f2d3a" text-anchor="start">7 tables, 2 types ENUM</text><text x="1418" y="526" font-size="15.5" fill="#1f2d3a" text-anchor="start">Index unique partiel :</text><text x="1418" y="556" font-size="15.5" fill="#1f2d3a" text-anchor="start">pas de double réservation</text><text x="1418" y="586" font-size="15.5" fill="#1f2d3a" text-anchor="start">Contrainte EXCLUDE :</text><text x="1418" y="616" font-size="15.5" fill="#1f2d3a" text-anchor="start">pas de chevauchement</text><text x="1418" y="646" font-size="15.5" fill="#1f2d3a" text-anchor="start">Clés étrangères composites</text><text x="1418" y="676" font-size="15.5" fill="#1f2d3a" text-anchor="start">2 triggers (updated_at)</text><line x1="1238" y1="622" x2="1398" y2="622" stroke="#b8500f" stroke-width="2.4"/><polygon points="1398.0,622.0 1386.1,627.3 1386.1,616.7" fill="#b8500f"/><polygon points="1238.0,622.0 1249.9,616.7 1249.9,627.3" fill="#b8500f"/><text x="1330" y="604" font-size="15" fill="#1f2d3a" text-anchor="middle">SQL préparé</text><text x="1330" y="650" font-size="15" fill="#5b6877" text-anchor="middle">transactions</text><text x="30" y="818" font-size="17" font-style="italic" fill="#5b6877" text-anchor="start">Une requête traverse les 5 étages de haut en bas, puis la réponse remonte par le même chemin. Chaque étage n'a qu'un seul rôle.</text></svg>