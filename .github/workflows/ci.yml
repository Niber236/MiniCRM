# Intégration continue : à chaque push et pull request, les tests tournent sur une base PostgreSQL réelle,
# avec deux combinaisons de versions (Node 20 + PostgreSQL 14 et Node 22 + PostgreSQL 16).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            postgres: 14
          - node: 22
            postgres: 16

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # Identifiants identiques à ceux de .env.test
          POSTGRES_USER: craftflow
          POSTGRES_PASSWORD: craftflow
          POSTGRES_DB: craftflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U craftflow -d craftflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer les tests
        run: npm test

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rechercher des vulnérabilités connues (dépendances de production)
        run: npm audit --omit=dev --audit-level=high
